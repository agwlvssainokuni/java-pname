plugins {
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'org.springframework.boot' version '4.1.0' apply false
}

subprojects {

    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'
    if (project.name in ['pname-cli', 'pname-web']) {
        apply plugin: 'org.springframework.boot'
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        if (project.name == 'pname-main') {
            jvmArgs += "-javaagent:${configurations.javaagent.asPath}"
        }
    }

    repositories { mavenCentral() }

    configurations { javaagent }

    dependencyManagement {
        imports {
            mavenBom 'org.springframework.boot:spring-boot-dependencies:4.1.0'
        }
        dependencies {
            dependency 'com.google.guava:guava:33.6.0-jre'
            dependency 'org.apache.commons:commons-csv:1.14.1'
            dependency 'org.apache.commons:commons-collections4:4.5.0'
            dependency 'com.atilika.kuromoji:kuromoji-ipadic:0.9.0'
            dependency 'com.ibm.icu:icu4j:78.3'
            dependency 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
        }
    }

    dependencies {
        if (project.name == 'pname-main') {
            implementation 'org.springframework.boot:spring-boot-starter'
            implementation 'org.springframework.boot:spring-boot-starter-aspectj'
            implementation 'com.google.guava:guava'
            implementation 'org.apache.commons:commons-lang3'
            implementation 'org.apache.commons:commons-csv'
            implementation 'org.apache.commons:commons-collections4'
            implementation 'tools.jackson.core:jackson-databind'
            implementation 'tools.jackson.dataformat:jackson-dataformat-yaml'
            implementation 'com.atilika.kuromoji:kuromoji-ipadic'
            implementation 'com.ibm.icu:icu4j'
            javaagent('org.mockito:mockito-core') { transitive = false }
        }
        if (project.name == 'pname-cli') {
            implementation project(':pname-main')
            implementation 'org.springframework.boot:spring-boot-starter'
            implementation 'org.apache.commons:commons-lang3'
            implementation 'org.apache.commons:commons-csv'
        }
        if (project.name == 'pname-web') {
            implementation project(':pname-main')
            implementation 'org.springframework.boot:spring-boot-starter-web'
            implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
            implementation 'org.apache.commons:commons-lang3'
            implementation 'org.apache.commons:commons-csv'
            implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui'
            testImplementation 'org.springframework.boot:spring-boot-starter-test'
            testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
        }
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
}
